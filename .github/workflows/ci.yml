name: CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -e services/api -e services/worker
      - name: Lint
        run: ruff check spectral_urbanism services
      - name: Type-check
        run: mypy spectral_urbanism
      - name: Test with coverage
        timeout-minutes: 10
        run: |
          pytest -q \
            --cov=spectral_urbanism \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60 \
            --timeout=120
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install secret scanner
        run: |
          python -m pip install --upgrade pip
          pip install detect-secrets>=1.5.0
      - name: Scan repository secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^.venv/|^web/node_modules/|^outputs/)' > /tmp/secrets.scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/secrets.scan.json').read_text())
          results = payload.get('results', {})
          if results:
            print('Potential secrets detected:')
            print(json.dumps(results, indent=2))
            raise SystemExit(1)
          print('No secrets detected')
          PY

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
      - name: Web tests
        run: npm test
      - name: Web build
        run: npm run build

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start compose services
        run: docker compose up -d --build redis api
      - name: Wait for API health
        env:
          HEALTH_URL: http://localhost:8000/api/v1/health
        run: |
          for i in $(seq 1 40); do
            if curl -fsS "$HEALTH_URL" >/dev/null; then
              echo "API is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          docker compose logs api
          exit 1
      - name: Shutdown compose
        if: always()
        run: docker compose down -v
