run:
  run_id: boston_dev
  seed: 42
  out_dir: outputs
city:
  name: Boston
  bbox:
  - -71.1912
  - 42.2279
  - -70.986
  - 42.3969
  crs: EPSG:4326
  grid_resolution_m: 1000
data_paths:
  root: data
  osm: data/osm/boston.osm.pbf
  lst_landsat: data/thermal/landsat_lst.tif
  lst_ecostress: data/thermal/ecostress_lst.tif
  lst_landsat_npy: data/thermal/landsat_lst.npy
  lst_ecostress_npy: data/thermal/ecostress_lst.npy
  ndvi_s2: data/ndvi/sentinel2_ndvi.tif
  ndvi_s2_npy: data/ndvi/sentinel2_ndvi.npy
  albedo: data/albedo/albedo.tif
  albedo_npy: data/albedo/albedo.npy
  impervious: data/landcover/impervious.tif
  impervious_npy: data/landcover/impervious.npy
  wind: data/wind/noaa_wind.csv
  svi: data/equity/cdc_svi.csv
  buildings: data/buildings/buildings.gpkg
  canopy: data/canopy/canopy.gpkg
features:
  auto_discover_plugins: true
  plugin_entrypoint_group: spectral_urbanism.feature_plugins
  plugin_contract_version: '1.0'
  required_capabilities:
  - thermal-observations
  - equity
  plugins:
  - raster_features
  - defaults
  - equity_placeholder
  observed_temp_column: lst
  rasters:
    ndvi:
      path_key: ndvi_s2
    albedo:
      path_key: albedo
    impervious:
      path_key: impervious
    lst:
      path_key: lst_landsat
  defaults:
    ndvi: 0.2
    albedo: 0.15
    impervious: 0.5
    lst: 35.0
  thermal_source: ecostress
  thermal_source_timestamp: null
graph:
  edge_mode: adjacency_plus_wind
  wind_k: 1
  weight_model:
    alpha_albedo: 1.0
    alpha_ndvi: 1.0
    alpha_wind: 0.5
    alpha_impervious: 1.0
    alpha_distance: 0.2
gmrf:
  tau: 1.0
  epsilon: 1e-3
  obs_noise: 0.5
interventions:
  budget_k: 5
  types:
  - tree
  - cool_roof
  - reflective_pavement
  - shade_corridor
  costs:
    tree: 1.0
    cool_roof: 1.0
    reflective_pavement: 0.7
    shade_corridor: 0.65
  effects:
    tree:
      edge_weight_multiplier: 1.17
    cool_roof:
      edge_weight_multiplier: 1.15
    reflective_pavement:
      edge_weight_multiplier: 1.18
    shade_corridor:
      edge_weight_multiplier: 1.2
objective:
  alpha_lambda2: 1.0
  beta_reliability: 1.0
  gamma_equity: 1.0
  equity:
    svi_column: SVI
    top_quantile: 0.8
baselines:
  enabled:
  - random
  - hottest
  - population
  - tree_only
  - cool_roof_only
experiments:
  monte_carlo_draws: 30
  reliability_p_keep: 0.95
  confidence_alpha: 0.05
  ablations:
  - no_equity
  - no_reliability
  - no_spectral
optimization:
  eval_top_k: 250
  stop_if_nonpositive_gain: true
  corridor_preference_weight: 2.5e-05
spatial_diagnostics:
  enabled: true
  use_as_corridor_preference: true
  access_low_threshold: 35.0
  access_very_low_threshold: 20.0
  sink_ndvi_quantile: 0.75
  sink_temp_quantile: 0.25
  sink_selection_mode: intersection
  validate_access_variation: true
