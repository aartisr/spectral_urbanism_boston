run:
  run_id: "city_dev"
  seed: 42
  out_dir: "outputs"

city:
  name: "YourCity"
  # bounding box: [min_lon, min_lat, max_lon, max_lat]
  bbox: [-71.1912, 42.2279, -70.9860, 42.3969]
  crs: "EPSG:4326"
  grid_resolution_m: 250

data_paths:
  root: "data"
  osm: "data/osm/city.osm.pbf"
  lst_landsat: "data/thermal/landsat_lst.tif"
  ndvi_s2: "data/ndvi/sentinel2_ndvi.tif"
  albedo: "data/albedo/albedo.tif"
  impervious: "data/landcover/impervious.tif"
  wind: "data/wind/noaa_wind.csv"
  svi: "data/equity/cdc_svi.csv"
  buildings: "data/buildings/buildings.gpkg"
  canopy: "data/canopy/canopy.gpkg"

features:
  auto_discover_plugins: true
  plugin_entrypoint_group: "spectral_urbanism.feature_plugins"
  plugin_contract_version: "1.0"
  required_capabilities: ["thermal-observations", "equity"]
  plugins: ["raster_features", "defaults", "equity_placeholder"]
  # Optional observation column for GMRF. Defaults to "lst".
  observed_temp_column: "lst"
  # Map feature columns to data_paths keys (or provide {path: ...} directly).
  rasters:
    ndvi: { path_key: "ndvi_s2" }
    albedo: { path_key: "albedo" }
    impervious: { path_key: "impervious" }
    lst: { path_key: "lst_landsat" }
  # Fallback values if raster features are missing.
  defaults:
    ndvi: 0.2
    albedo: 0.15
    impervious: 0.5
    lst: 35.0

graph:
  edge_mode: "adjacency_plus_wind"
  wind_k: 2
  weight_model:
    alpha_albedo: 1.0
    alpha_ndvi: 1.0
    alpha_wind: 0.5
    alpha_impervious: 1.0
    alpha_distance: 0.2

gmrf:
  tau: 1.0
  epsilon: 1e-3
  obs_noise: 0.5

interventions:
  budget_k: 25
  types: ["tree", "cool_roof", "reflective_pavement", "shade_corridor"]
  costs:
    tree: 1.0
    cool_roof: 1.0
    reflective_pavement: 1.0
    shade_corridor: 2.0
  # To add a new intervention, add it under types/costs/effects.
  # Prefer edge_weight_multiplier for explicit control.
  effects:
    tree:
      edge_weight_multiplier: 1.17
    cool_roof:
      edge_weight_multiplier: 1.15
    reflective_pavement:
      edge_weight_multiplier: 1.10
    shade_corridor:
      edge_weight_multiplier: 1.10

objective:
  alpha_lambda2: 1.0
  beta_reliability: 1.0
  gamma_equity: 1.0
  equity:
    svi_column: "SVI"
    top_quantile: 0.8

baselines:
  enabled: ["random", "hottest", "population", "tree_only", "cool_roof_only"]

experiments:
  monte_carlo_draws: 100
  reliability_p_keep: 0.95
  confidence_alpha: 0.05
  # When true, fail the run if observed thermal data has low variation.
  # When false, continue run and mark reduced operational confidence in reports.
  enforce_thermal_variation_gate: false
  ablations: ["no_equity", "no_reliability", "no_spectral"]

optimization:
  eval_top_k: 250
  stop_if_nonpositive_gain: true
  # Soft preference for heat-corridor cells during greedy selection.
  # +w bonus for corridor targets, -w penalty for non-corridor targets.
  # Keep small (e.g., 1e-5 to 5e-5) so objective score still dominates.
  corridor_preference_weight: 0.0

spatial_diagnostics:
  # Produces plug-and-play vector layers:
  # cheeger_bottleneck.geojson, low_cooling_access_zones.geojson,
  # cooling_access_cells.geojson, and cheeger_resistance_summary.json.
  enabled: true
  # When true, Cheeger boundary cells and low cooling-access cells are included
  # in the optimizer's soft corridor preference set.
  use_as_corridor_preference: true
  access_low_threshold: 35.0
  access_very_low_threshold: 20.0
  sink_ndvi_quantile: 0.75
  sink_temp_quantile: 0.25
