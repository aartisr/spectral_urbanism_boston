[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-urbanism"
version = "0.1.0"
description = "Spectral Urbanism: plug-and-play optimization for equitable UHI mitigation across cities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "networkx>=3.1",
  "geopandas>=0.14",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "matplotlib>=3.7",
  "click>=8.1",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-timeout>=2.2",
  "black>=24.0",
  "ruff>=0.3",
  "mypy>=1.7",
  "pre-commit>=3.6",
  "detect-secrets>=1.5.0",
]

[project.scripts]
spectral-urbanism = "spectral_urbanism.cli:main"

[project.entry-points."spectral_urbanism.feature_plugins"]
raster_features = "spectral_urbanism.city.plugins:_raster_features_plugin"
defaults = "spectral_urbanism.city.plugins:_defaults_plugin"
equity_placeholder = "spectral_urbanism.city.plugins:_equity_placeholder_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["spectral_urbanism*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = [
  "--tb=short",
  "--cov=spectral_urbanism",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=60",
]

[tool.coverage.run]
omit = ["tests/*", "*/__init__.py", "pipelines/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
