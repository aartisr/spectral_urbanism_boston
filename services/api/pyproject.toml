[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-urbanism-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "celery>=5.4",
  "redis>=5.0",
  "httpx>=0.28"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
