[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-urbanism-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "celery>=5.4",
  "redis>=5.0",
  "pyyaml>=6.0",
  "pydantic>=2.7"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
